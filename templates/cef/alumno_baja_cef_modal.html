<div id="modalBajaAlumnoCef" class="cef-docente-overlay{% if baja_modal_alumno %} is-open{% endif %}" aria-hidden="{% if baja_modal_alumno %}false{% else %}true{% endif %}">
    <div class="cef-docente-modal" role="dialog" aria-modal="true" aria-labelledby="bajaAlumnoCefTitulo">
        <div class="cef-docente-modal-head">
            <h2 id="bajaAlumnoCefTitulo" class="cef-docente-modal-title">
                <i class="fa-solid fa-user-slash me-2"></i>Alumnos <span>» Baja del CEF</span>
            </h2>
            <button class="cef-docente-close" type="button" aria-label="Cerrar" data-cef-baja-close>
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="cef-docente-modal-body" data-cef-baja-content>
            {% if baja_modal_alumno %}
                {% include "cef/alumno_baja_cef_contenido.html" %}
            {% endif %}
        </div>
    </div>
</div>
