{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <link
        rel="icon"
        href="{% static 'img/logoEstMini.png' %}"
        type="image/png"
    />

    <title>{{ title }}</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="{% static 'lib/AdminLTE-3.0.4/plugins/fontawesome-free/css/all.min.css' %}"
    >

    <!-- AdminLTE -->
    <link
        rel="stylesheet"
        href="{% static 'lib/AdminLTE-3.0.4/dist/css/adminlte.min.css' %}"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700"
        rel="stylesheet"
    >

    <!-- jQuery -->
    <script
        src="{% static 'lib/AdminLTE-3.0.4/plugins/jquery/jquery.min.js' %}">
    </script>

    <!-- Bootstrap -->
    <script
        src="{% static 'lib/AdminLTE-3.0.4/plugins/bootstrap/js/bootstrap.bundle.min.js' %}">
    </script>

    <!-- AdminLTE -->
    <script
        src="{% static 'lib/AdminLTE-3.0.4/dist/js/adminlte.min.js' %}">
    </script>

    <!-- SweetAlert2 -->
    <script
        src="{% static 'lib/sweetalert2/sweetalert2.all.min.js' %}">
    </script>

    <!-- jQuery Confirm -->
    <link
        rel="stylesheet"
        href="{% static 'lib/jquery-confirm-v3.3.4/jquery-confirm.min.css' %}"
    >

    <script
        src="{% static 'lib/jquery-confirm-v3.3.4/jquery-confirm.min.js' %}">
    </script>

    <!-- Estilos propios -->
    <link
        rel="stylesheet"
        href="{% static 'superv/mystyle.css' %}"
    >

    <!-- Funciones propias -->
    <script
        src="{% static 'superv/functions.js' %}">
    </script>

    {% block extra_css %}
    {% endblock %}

    {% block head %}
    {% endblock %}

</head>

<body class="hold-transition sidebar-mini layout-fixed">

    <!-- =========================================================
         ESTADO GLOBAL DEL SISTEMA
    ========================================================== -->
    <script>

        window.estadoGlobalSistema =
            {{ estado|default:"null"|safe }};

        $(document).ready(function () {

            const estadoGlobal =
                window.estadoGlobalSistema;

            if (!estadoGlobal) {
                return;
            }

            console.log(
                "🔥 Restaurando estado global:",
                estadoGlobal
            );


            // =====================================================
            // SIDEBAR
            // =====================================================

            if (
                estadoGlobal.sidebar ===
                "collapsed"
            ) {

                $("body").addClass(
                    "sidebar-collapse"
                );

            }


            // =====================================================
            // MENÚ ACTIVO
            // =====================================================

            if (estadoGlobal.menu) {

                $(".nav-link").each(
                    function () {

                        if (
                            $(this).data("menu")
                            ===
                            estadoGlobal.menu
                        ) {

                            $(this).addClass(
                                "active"
                            );

                        }

                    }
                );

            }


            // =====================================================
            // ÚLTIMA URL
            // =====================================================

            if (estadoGlobal.url) {

                console.log(
                    "Última URL:",
                    estadoGlobal.url
                );

            }


            // =====================================================
            // SCROLL GLOBAL
            // =====================================================

            if (estadoGlobal.scroll) {

                window.scrollTo(
                    0,
                    estadoGlobal.scroll
                );

            }

        });

    </script>


    <!-- =========================================================
         CONTENIDO PRINCIPAL
    ========================================================== -->

    {% block body %}
    {% endblock %}


    <!-- =========================================================
         SCRIPTS ESPECÍFICOS DE CADA TEMPLATE
    ========================================================== -->

    {% block scripts %}
    {% endblock %}


</body>

</html>
