<div class="modal biblioteca-section-info-modal"
     id="bibliotecaSectionInfoModal"
     tabindex="-1"
     role="dialog"
     aria-labelledby="bibliotecaSectionInfoModalTitulo"
     aria-describedby="bibliotecaSectionInfoModalMensaje"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="biblioteca-section-info-modal__header">
                <span class="biblioteca-section-info-modal__section-icon" aria-hidden="true">
                    <span class="biblioteca-symbol biblioteca-symbol--filled"
                          data-biblioteca-section-info-icon>info</span>
                </span>

                <div class="biblioteca-section-info-modal__heading">
                    <span class="biblioteca-section-info-modal__eyebrow">Qué cargar</span>
                    <h2 class="biblioteca-section-info-modal__title"
                        id="bibliotecaSectionInfoModalTitulo"
                        data-biblioteca-section-info-title>
                        Información
                    </h2>
                </div>
            </div>

            <div class="biblioteca-section-info-modal__body">
                <p class="biblioteca-section-info-modal__intro"
                   id="bibliotecaSectionInfoModalMensaje"
                   data-biblioteca-section-info-message></p>

                <div class="biblioteca-section-info-modal__fields"
                     data-biblioteca-section-info-fields></div>
            </div>

            <div class="biblioteca-section-info-modal__footer">
                <button type="button"
                        class="btn btn-primary"
                        data-dismiss="modal">
                    Entendido
                </button>
            </div>
        </div>
    </div>
</div>
