{% extends 'biblioteca/layout.html' %}

{% block content %}

    <!-- Botón para abrir el modal -->
    <div class="container text-center mt-4">
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#reporteModal">
            Generar Reporte
        </button>
    </div>

    <!-- Modal Form -->     
    <div class="modal fade" id="reporteModal" tabindex="-1" aria-labelledby="reporteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content shadow-lg rounded">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title font-weight-bold" id="reporteModalLabel">Generar Reporte</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="formReporte" method="POST" action="{% url 'bibliotecas:generar_pdf' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="cueanexo" class="font-weight-bold">Cueanexo</label>
                            <input type="text" class="form-control border-primary text-center" id="cueanexo" name="cueanexo"
                                required value="{{ cueanexo }}" readonly 
                                size="9" style="width: 10ch;">
                        </div>
 
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="mes" class="font-weight-bold">Mes</label>
                                <select id="mes" name="mes" class="form-control border-primary" required>
                                    <option value="" disabled selected>Seleccione un mes</option>
                                    
                                    <option value="ABRIL">Abril</option>
                                    
                                    <option value="JULIO">Julio</option>
                                    
                                    <option value="NOVIEMBRE">Noviembre</option>
                                    
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="anio" class="font-weight-bold">Año</label>
                                <input type="number" class="form-control border-primary text-center" id="anio" name="anio"                                      
                                    maxlength="4" min="2025" max="2099" pattern="\d{4}" title="Debe contener exactamente 4 dígitos"
                                    oninput="this.value = this.value.replace(/\D/g, '').slice(0, 4)"
                                    size="4" style="width: 10ch;">
                            </div>
                        </div>

                        <div>
                            <button type="submit" class="btn btn-primary btn-lg btn-block shadow-sm">
                                <i class="fas fa-file-pdf mr-2"></i> Generar PDF
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Validación en JavaScript -->
    <script>
        document.getElementById("formReporte").addEventListener("submit", function(event) {
            let mesSeleccionado = document.getElementById("mes").value;
            if (!mesSeleccionado) {
                event.preventDefault(); // Evita el envío si no se seleccionó un mes
                alert("Por favor, selecciona un mes.");
            }
        });
        // Redirigir a la página deseada al cerrar el modal
        $('#reporteModal').on('hidden.bs.modal', function () {
            window.location.href = "{% url 'bibliotecas:dashboard' %}";
        });
    </script>
{% endblock %}
