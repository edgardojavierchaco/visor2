{% extends "especial/base_operativo_especial.html" %}



{% block especial_content %}
{% include "especial/partials/docentes_contenido_especial.html" %}
{% if not especial_partial %}
<script>
(function () {
    if (!window.cefProfesorDropdownReady) {
        window.cefProfesorDropdownReady = true;

        function closeDropdown(dropdown) {
            if (!dropdown) return;
            var toggle = dropdown.querySelector("[data-cef-profesor-dropdown-toggle]");
            var menu = dropdown.querySelector("[data-cef-profesor-dropdown-menu]");
            if (toggle) toggle.setAttribute("aria-expanded", "false");
            if (menu) {
                menu.classList.remove("show");
                menu.removeAttribute("style");
            }
        }

        function closeOtherDropdowns(current) {
            document.querySelectorAll("[data-cef-profesor-dropdown]").forEach(function(dropdown) {
                if (dropdown !== current) closeDropdown(dropdown);
            });
        }

        function positionMenu(toggle, menu) {
            var rect = toggle.getBoundingClientRect();
            var menuWidth = Math.min(320, window.innerWidth - 24);
            var left = Math.min(rect.left, window.innerWidth - menuWidth - 12);
            menu.style.position = "fixed";
            menu.style.top = (rect.bottom + 4) + "px";
            menu.style.left = Math.max(12, left) + "px";
            menu.style.width = menuWidth + "px";
            menu.style.zIndex = "1090";
        }

        document.addEventListener("click", function(event) {
            var toggle = event.target.closest("[data-cef-profesor-dropdown-toggle]");
            if (toggle) {
                event.preventDefault();
                var dropdown = toggle.closest("[data-cef-profesor-dropdown]");
                var menu = dropdown ? dropdown.querySelector("[data-cef-profesor-dropdown-menu]") : null;
                if (!dropdown || !menu) return;

                var willOpen = !menu.classList.contains("show");
                closeOtherDropdowns(dropdown);
                toggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
                menu.classList.toggle("show", willOpen);
                if (willOpen) {
                    positionMenu(toggle, menu);
                } else {
                    menu.removeAttribute("style");
                }
                return;
            }

            if (!event.target.closest("[data-cef-profesor-dropdown-menu]")) {
                closeOtherDropdowns(null);
            }
        });

        window.addEventListener("scroll", function() {
            closeOtherDropdowns(null);
        }, true);
        window.addEventListener("resize", function() {
            closeOtherDropdowns(null);
        });
    }

    function closeProfesorDropdowns() {
        document.querySelectorAll("[data-cef-profesor-dropdown]").forEach(function(dropdown) {
            var toggle = dropdown.querySelector("[data-cef-profesor-dropdown-toggle]");
            var menu = dropdown.querySelector("[data-cef-profesor-dropdown-menu]");
            if (toggle) toggle.setAttribute("aria-expanded", "false");
            if (menu) {
                menu.classList.remove("show");
                menu.removeAttribute("style");
            }
        });
    }

    var asignarModal = document.getElementById("modalAsignarProfesorGrupo");
    if (!asignarModal || window.cefAsignarProfesorGrupoReady) return;
    window.cefAsignarProfesorGrupoReady = true;

    function setText(selector, value) {
        var el = asignarModal.querySelector(selector);
        if (el) el.textContent = value || "";
    }

    function setValue(selector, value) {
        var el = asignarModal.querySelector(selector);
        if (el) el.value = value || "";
    }

    function openAsignarModal(trigger) {
        setValue("[data-cef-asignar-seccion-id]", trigger.dataset.grupoId);
        setValue("[data-cef-asignar-docente-cuil]", trigger.dataset.docenteCuil);
        setText("[data-cef-asignar-grupo-label]", trigger.dataset.grupoLabel);
        setText(
            "[data-cef-asignar-docente-label]",
            (trigger.dataset.docenteNombre || "Profesor") + " - " + trigger.dataset.docenteCuil
        );
        asignarModal.classList.add("is-open");
        asignarModal.setAttribute("aria-hidden", "false");
    }

    function closeAsignarModal() {
        asignarModal.classList.remove("is-open");
        asignarModal.setAttribute("aria-hidden", "true");
    }

    function replaceProfesorFragment(selector, html) {
        var current = selector ? document.querySelector(selector) : null;
        if (!current || typeof html !== "string") return false;
        current.innerHTML = html;
        if (window.initCefProfesoresTable) {
            window.initCefProfesoresTable(current);
        }
        return true;
    }

    function replaceAsignarModal(html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var incomingModal = doc.getElementById("modalAsignarProfesorGrupo");
        var currentDialog = asignarModal.querySelector(".cef-docente-modal");
        var incomingDialog = incomingModal ? incomingModal.querySelector(".cef-docente-modal") : null;
        if (!currentDialog || !incomingDialog) return false;
        currentDialog.innerHTML = incomingDialog.innerHTML;
        asignarModal.classList.add("is-open");
        asignarModal.setAttribute("aria-hidden", "false");
        return true;
    }

    document.addEventListener("click", function(event) {
        var trigger = event.target.closest("[data-cef-asignar-grupo-open]");
        if (trigger) {
            if (!asignarModal || !asignarModal.contains(trigger)) return;
            event.preventDefault();
            if (trigger.classList.contains("disabled") || trigger.getAttribute("aria-disabled") === "true" || !trigger.dataset.grupoId) {
                return;
            }
            closeProfesorDropdowns();
            openAsignarModal(trigger);
            return;
        }

        if (asignarModal && asignarModal.contains(event.target) && (event.target === asignarModal || event.target.closest("[data-cef-asignar-grupo-close]"))) {
            event.preventDefault();
            closeAsignarModal();
        }
    });

    document.addEventListener("submit", function(event) {
        var form = event.target.closest("[data-cef-asignar-grupo-form]");
        if (!form || !asignarModal || !asignarModal.contains(form)) return;

        event.preventDefault();
        var submitBtn = form.querySelector("button[type='submit']");
        if (submitBtn) submitBtn.disabled = true;

        fetch(form.getAttribute("action"), {
            method: "POST",
            body: new FormData(form),
            headers: { "X-Requested-With": "XMLHttpRequest" },
            credentials: "same-origin"
        })
            .then(function(response) {
                if (!response.ok) throw new Error("No se pudo guardar.");
                var contentType = response.headers.get("content-type") || "";
                if (contentType.indexOf("application/json") === -1) {
                    return response.text().then(function(html) {
                        return { fallback_html: html, close_modal: response.redirected };
                    });
                }
                return response.json();
            })
            .then(function(data) {
                if (data.fragment_html) {
                    if (!replaceProfesorFragment(data.fragment_selector, data.fragment_html)) {
                        form.submit();
                        return;
                    }
                    if (data.close_modal) {
                        closeAsignarModal();
                    } else if (data.modal_html) {
                        replaceAsignarModal(data.modal_html);
                    }
                    return;
                }
                if (data.modal_html && replaceAsignarModal(data.modal_html)) {
                    return;
                }
                if (data.fallback_html) {
                    window.location.reload();
                    return;
                }
                form.submit();
            })
            .catch(function() {
                form.submit();
            })
            .finally(function() {
                if (submitBtn) submitBtn.disabled = false;
            });
    });
})();
</script>
{% endif %}
{% endblock %}
