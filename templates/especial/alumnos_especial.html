{% extends "especial/base_operativo_especial.html" %}


{% block especial_content %}
{% include "especial/partials/alumnos_contenido_especial.html" %}
{% if not especial_partial %}
<script>
(function () {
    if (window.cefAlumnoDropdownReady) return;
    window.cefAlumnoDropdownReady = true;

    function closeDropdown(dropdown) {
        if (!dropdown) return;
        var toggle = dropdown.querySelector("[data-cef-alumno-dropdown-toggle]");
        var menu = dropdown.querySelector("[data-cef-alumno-dropdown-menu]");
        if (toggle) toggle.setAttribute("aria-expanded", "false");
        if (menu) {
            menu.classList.remove("show");
            menu.removeAttribute("style");
        }
    }

    function closeOtherDropdowns(current) {
        document.querySelectorAll("[data-cef-alumno-dropdown]").forEach(function(dropdown) {
            if (dropdown !== current) closeDropdown(dropdown);
        });
    }

    function positionMenu(toggle, menu) {
        var rect = toggle.getBoundingClientRect();
        var tableWrap = toggle.closest(".cef-table-wrap");
        var bounds = tableWrap ? tableWrap.getBoundingClientRect() : { left: 12, right: window.innerWidth - 12 };
        var menuWidth = Math.min(320, window.innerWidth - 24);
        var left = Math.min(rect.left, bounds.right - menuWidth - 8);
        menu.style.position = "fixed";
        menu.style.top = (rect.bottom + 4) + "px";
        menu.style.left = Math.max(bounds.left + 8, left) + "px";
        menu.style.width = menuWidth + "px";
        menu.style.zIndex = "1090";
    }

    document.addEventListener("click", function(event) {
        var toggle = event.target.closest("[data-cef-alumno-dropdown-toggle]");
        if (toggle) {
            event.preventDefault();
            var dropdown = toggle.closest("[data-cef-alumno-dropdown]");
            var menu = dropdown ? dropdown.querySelector("[data-cef-alumno-dropdown-menu]") : null;
            if (!dropdown || !menu) return;

            var willOpen = !menu.classList.contains("show");
            closeOtherDropdowns(dropdown);
            toggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
            menu.classList.toggle("show", willOpen);
            if (willOpen) {
                positionMenu(toggle, menu);
            } else {
                menu.removeAttribute("style");
            }
            return;
        }

        if (!event.target.closest("[data-cef-alumno-dropdown-menu]")) {
            closeOtherDropdowns(null);
        }
    });

    window.addEventListener("scroll", function() {
        closeOtherDropdowns(null);
    }, true);
    window.addEventListener("resize", function() {
        closeOtherDropdowns(null);
    });
})();
</script>
{% endif %}
{% endblock %}
