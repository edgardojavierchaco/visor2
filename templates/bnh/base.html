{% load static %}<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Personal educativo · Chaco{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
<link rel="stylesheet" href="{% static 'bnh/css/ministerial.css' %}"></head>
<body><a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
<header class="bnh-header"><div class="container-xl d-flex justify-content-between align-items-center"><a href="{% url 'bnhpersonas:personas_list' %}">CHACO <span>Estadísticas Educativas</span></a><small>{{ request.user }}</small></div></header>
<main id="contenido" class="container-xl py-4">
{% for message in messages %}<div class="alert alert-info" role="status">{{ message }}</div>{% endfor %}
<div id="network-error" class="alert alert-danger" role="alert" hidden></div>
{% block content %}{% endblock %}</main>
<footer class="container-xl py-4 text-muted">BNH · Gestión de personal educativo docente y no docente</footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="{% static 'bnh/js/ministerial.js' %}" defer></script></body></html>
